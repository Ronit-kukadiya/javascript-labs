<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script type="text/javascript">
		var exp = prompt('enter exp: ');
		let n1 =parseInt(prompt('enter n1:'));
		let n2 =parseInt(prompt('enter n2:'));
        let res;
        if (exp == '+') 
        {
        	res=n1+n2;
        }
        else if (exp == '-') 
        {
        	res=n1-n2;
        } 
        else if (exp == '*') 
        {
        	res=n1*n2;
        }  
        else if (exp == '%') 
        {
        	res=n1%n2;
        }
        else if(exp == '/') 
        {
        	res=n1/n2;
        }                      
        alert(res)
        document.write(res);
    </script>
	<title></title>
</head>
<body>

</body>
</html>
