
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<script type="text/javascript">
		n=parseInt(prompt("enter the number"))
		save=n
		c=parseInt(n%10)
		n=parseInt(n/10)
		b=parseInt(n%10)
		n=parseInt(n/10)
		a=parseInt(n%10)
		n=save
		a1=["Zero","one","two","three","four","five","six","seven","eight","nine"]
		a2=["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","ninteen"]
		a3=["twenty","thirty","fourty","fifty","sixty","seventy","eighty","ninty"]
		
		ans=" "
		if(n>999){
			document.write("number is out of range")
		}
		else if(n>99){
			
			ans=ans+a1[a]+"hundred"
		}
		if(b==1){
			ans=ans+a2[c]
		}
		else if(b>=2&&b<=9){
			ans=ans+a3[b-2]
		if(c>0){
			ans=ans+a1[c]
		}
		}
		else{
			ans=ans+a1[c]
	    }
	document.write(ans)
	</script>

</body>
</html>
